name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client:
    name: Client (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  server:
    name: Server (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Boot & health check
        run: |
          node index.js &
          SERVER_PID=$!
          for i in {1..15}; do
            sleep 1
            if curl -sf http://127.0.0.1:3001/health; then
              echo "OK"
              kill $SERVER_PID
              exit 0
            fi
          done
          echo "Servidor no respondió a /health"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
