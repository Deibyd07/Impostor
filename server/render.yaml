services:
  - type: web
    name: el-impostor-server
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: ROOM_TTL_SECONDS
        value: 7200
